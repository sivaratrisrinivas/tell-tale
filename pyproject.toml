[project]
name = "telltale"
version = "0.1.0"
description = "A slop detector for open-source PR and issue descriptions"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Core deps cover data extraction and mirror generation (M0-M3, M7 polish). No torch needed for those.
dependencies = [
  "pandas>=2", "pyarrow>=14", "numpy>=1.26", "pyyaml>=6", "requests>=2.31", "tabulate>=0.9",
  "datasketch>=1.6", "openai>=1.40", "huggingface_hub>=0.24",
]
[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.48", "tokenizers>=0.19", "scikit-learn>=1.4", "onnx>=1.16", "onnxruntime>=1.18"]
space = ["gradio>=4.40"]
dev = ["pytest>=8", "telltale[train]"]
[project.scripts]
telltale = "telltale.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["telltale*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
